<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Egg Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #1c1c1e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Главный экран */
        .game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 20px;
        }

        /* Контейнер для контента */
        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .egg {
            width: 160px;
            height: 210px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.08s ease;
        }

        .egg:active {
            transform: scale(0.9);
        }

        .counter {
            margin-top: 30px;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .click-value {
            margin-top: 10px;
            font-size: 18px;
            color: #aaa;
        }

        /* Кнопка магазина - фиксированная позиция */
        .shop-button {
            position: fixed;
            top: max(20px, env(safe-area-inset-top, 20px));
            right: max(20px, env(safe-area-inset-right, 20px));
            background: linear-gradient(135deg, #0088cc, #0066aa);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            z-index: 1000;
        }

        .shop-button:active {
            transform: scale(0.95);
        }

        /* Экран магазина */
        .shop-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .shop-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .balance {
            font-size: 24px;
            margin-bottom: 30px;
            color: #ffd700;
            font-weight: bold;
        }

        .shop-item {
            background: linear-gradient(135deg, #2c2c2e, #3a3a3c);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .item-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .item-desc {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .item-level {
            font-size: 13px;
            color: #0088cc;
            font-weight: bold;
        }

        .buy-button {
            background: linear-gradient(135deg, #34c759, #28a745);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
            white-space: nowrap;
        }

        .buy-button:disabled {
            background: linear-gradient(135deg, #555, #666);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .buy-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .back-button {
            background: linear-gradient(135deg, #ff3b30, #d32f2f);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        .back-button:active {
            transform: scale(0.95);
        }

        /* Адаптивность для маленьких экранов */
        @media (max-width: 480px) {
            .egg {
                width: 140px;
                height: 180px;
            }

            .counter {
                font-size: 40px;
            }

            .shop-button {
                padding: 10px 20px;
                font-size: 14px;
            }

            .shop-title {
                font-size: 28px;
            }

            .balance {
                font-size: 20px;
            }

            .shop-item {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .buy-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Главный экран -->
    <div class="game-screen" id="gameScreen">
        <button class="shop-button" id="shopBtn">🛒 Shop</button>
        
        <div class="game-content">
            <div class="egg" id="egg"></div>
            <div class="counter" id="counter">0</div>
            <div class="click-value" id="clickValue">+1 за клик</div>
        </div>
    </div>

    <!-- Экран магазина -->
    <div class="shop-screen" id="shopScreen">
        <div class="shop-title">🛒 Магазин</div>
        <div class="balance">💰 Баланс: <span id="shopBalance">0</span></div>
        
        <div class="shop-item">
            <div class="item-info">
                <div class="item-name">⚡ Сила клика</div>
                <div class="item-desc" id="itemDesc">+2 за каждое нажатие</div>
                <div class="item-level" id="itemLevel">Уровень: 0</div>
            </div>
            <button class="buy-button" id="buyButton">Купить (500)</button>
        </div>

        <button class="back-button" id="backBtn">← Назад</button>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Загружаем данные из localStorage
        let count = parseInt(localStorage.getItem('eggCount')) || 0;
        let upgradeLevel = parseInt(localStorage.getItem('upgradeLevel')) || 0;

        const egg = document.getElementById('egg');
        const counter = document.getElementById('counter');
        const clickValueDisplay = document.getElementById('clickValue');
        const shopBtn = document.getElementById('shopBtn');
        const backBtn = document.getElementById('backBtn');
        const gameScreen = document.getElementById('gameScreen');
        const shopScreen = document.getElementById('shopScreen');
        const shopBalance = document.getElementById('shopBalance');
        const buyButton = document.getElementById('buyButton');
        const itemDesc = document.getElementById('itemDesc');
        const itemLevel = document.getElementById('itemLevel');

        // Функция для расчета стоимости улучшения
        function getUpgradeCost(level) {
            return 500 + (level * 750);
        }

        // Функция для расчета силы клика
        function getClickPower(level) {
            return 1 + level;
        }

        // Обновление интерфейса
        function updateUI() {
            const clickPower = getClickPower(upgradeLevel);
            const nextCost = getUpgradeCost(upgradeLevel);

            // Главный экран
            counter.textContent = count;
            clickValueDisplay.textContent = `+${clickPower} за клик`;

            // Магазин
            shopBalance.textContent = count;
            itemLevel.textContent = `Уровень: ${upgradeLevel}`;
            itemDesc.textContent = `+${clickPower + 1} за каждое нажатие`;
            buyButton.textContent = `Купить (${nextCost})`;

            // Активность кнопки
            if (count < nextCost) {
                buyButton.disabled = true;
            } else {
                buyButton.disabled = false;
            }
        }

        // Клик по яйцу
        egg.addEventListener('click', function () {
            const clickPower = getClickPower(upgradeLevel);
            count += clickPower;
            localStorage.setItem('eggCount', count);
            updateUI();

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Открыть магазин
        shopBtn.addEventListener('click', function () {
            gameScreen.style.display = 'none';
            shopScreen.style.display = 'flex';
            updateUI();
        });

        // Вернуться назад
        backBtn.addEventListener('click', function () {
            shopScreen.style.display = 'none';
            gameScreen.style.display = 'flex';
            updateUI();
        });

        // Купить улучшение
        buyButton.addEventListener('click', function () {
            const cost = getUpgradeCost(upgradeLevel);
            
            if (count >= cost) {
                count -= cost;
                upgradeLevel++;
                
                localStorage.setItem('eggCount', count);
                localStorage.setItem('upgradeLevel', upgradeLevel);
                
                updateUI();

                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            }
        });

        // Инициализация
        updateUI();
    </script>

</body>
</html>

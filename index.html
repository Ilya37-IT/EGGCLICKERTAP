<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Egg Tap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #1c1c1e;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Главный экран */
        .game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 20px;
        }

        /* Контейнер для контента */
        .game-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            width: 100%;
        }

        .egg {
            width: 160px;
            height: 210px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e0e0 100%);
            border-radius: 50% 50% 45% 45%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.08s ease;
        }

        .egg:active {
            transform: scale(0.9);
        }

        .egg.auto-clicking {
            animation: autoClick 0.1s ease infinite;
        }

        @keyframes autoClick {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.92); }
        }

        .counter {
            margin-top: 30px;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .click-value {
            margin-top: 10px;
            font-size: 18px;
            color: #aaa;
        }

        /* Кнопка магазина - фиксированная позиция */
        .shop-button {
            position: fixed;
            top: max(20px, env(safe-area-inset-top, 20px));
            right: max(20px, env(safe-area-inset-right, 20px));
            background: linear-gradient(135deg, #0088cc, #0066aa);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            z-index: 1000;
        }

        .shop-button:active {
            transform: scale(0.95);
        }

        /* Иконка автокликера */
        .autoclicker-icon {
            position: fixed;
            top: max(20px, env(safe-area-inset-top, 20px));
            left: max(20px, env(safe-area-inset-left, 20px));
            background: linear-gradient(135deg, #ff9500, #ff6b00);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            z-index: 1000;
            display: none;
        }

        .autoclicker-icon.visible {
            display: block;
        }

        .autoclicker-icon:active:not(:disabled) {
            transform: scale(0.95);
        }

        .autoclicker-icon:disabled {
            background: linear-gradient(135deg, #666, #555);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .autoclicker-timer {
            display: block;
            font-size: 12px;
            margin-top: 4px;
            color: #ffd700;
        }

        /* Экран магазина */
        .shop-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }

        .shop-title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .balance {
            font-size: 24px;
            margin-bottom: 30px;
            color: #ffd700;
            font-weight: bold;
        }

        .shop-item {
            background: linear-gradient(135deg, #2c2c2e, #3a3a3c);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .item-info {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .item-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .item-desc {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .item-level {
            font-size: 13px;
            color: #0088cc;
            font-weight: bold;
        }

        .buy-button {
            background: linear-gradient(135deg, #34c759, #28a745);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s ease;
            white-space: nowrap;
        }

        .buy-button:disabled {
            background: linear-gradient(135deg, #555, #666);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .buy-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .back-button {
            background: linear-gradient(135deg, #ff3b30, #d32f2f);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        .back-button:active {
            transform: scale(0.95);
        }

        /* Адаптивность для маленьких экранов */
        @media (max-width: 480px) {
            .egg {
                width: 140px;
                height: 180px;
            }

            .counter {
                font-size: 40px;
            }

            .shop-button {
                padding: 10px 20px;
                font-size: 14px;
            }

            .autoclicker-icon {
                padding: 10px 16px;
                font-size: 14px;
            }

            .shop-title {
                font-size: 28px;
            }

            .balance {
                font-size: 20px;
            }

            .shop-item {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }

            .buy-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Главный экран -->
    <div class="game-screen" id="gameScreen">
        <button class="shop-button" id="shopBtn">🛒 Shop</button>
        <button class="autoclicker-icon" id="autoclickerIcon">
            ⚡ <span id="autoclickerCount">0</span>
            <span class="autoclicker-timer" id="autoclickerTimer"></span>
        </button>
        
        <div class="game-content">
            <div class="egg" id="egg"></div>
            <div class="counter" id="counter">0</div>
            <div class="click-value" id="clickValue">+1 за клик</div>
        </div>
    </div>

    <!-- Экран магазина -->
    <div class="shop-screen" id="shopScreen">
        <div class="shop-title">🛒 Магазин</div>
        <div class="balance">💰 Баланс: <span id="shopBalance">0</span></div>
        
        <div class="shop-item">
            <div class="item-info">
                <div class="item-name">⚡ Сила клика</div>
                <div class="item-desc" id="clickUpgradeDesc">+2 за каждое нажатие</div>
                <div class="item-level" id="clickUpgradeLevel">Уровень: 0</div>
            </div>
            <button class="buy-button" id="buyClickUpgrade">Купить (500)</button>
        </div>

        <div class="shop-item">
            <div class="item-info">
                <div class="item-name">🤖 Автокликер</div>
                <div class="item-desc">25 секунд автоматических кликов</div>
                <div class="item-level" id="autoclickerOwned">Куплено: 0</div>
            </div>
            <button class="buy-button" id="buyAutoclicker">Купить (4750)</button>
        </div>

        <button class="back-button" id="backBtn">← Назад</button>
    </div>

    <script>
    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }

    // ПРИНУДИТЕЛЬНО очищаем всё при загрузке
    localStorage.clear();
    sessionStorage.clear();

    // Данные хранятся только в памяти
    let count = 0;
    let upgradeLevel = 0;

    let autoclickerCount = 0;      // сколько зарядов доступно сейчас
    let autoclickerPurchases = 0;  // сколько всего куплено (для цены, только растёт)

    let autoclickerActive = false;
    let autoclickerTimeLeft = 0;
    let autoclickerInterval = null;
    let autoclickerTimerInterval = null;

    const egg = document.getElementById('egg');
    const counter = document.getElementById('counter');
    const clickValueDisplay = document.getElementById('clickValue');
    const shopBtn = document.getElementById('shopBtn');
    const backBtn = document.getElementById('backBtn');
    const gameScreen = document.getElementById('gameScreen');
    const shopScreen = document.getElementById('shopScreen');
    const shopBalance = document.getElementById('shopBalance');

    // Улучшение силы клика
    const buyClickUpgrade = document.getElementById('buyClickUpgrade');
    const clickUpgradeDesc = document.getElementById('clickUpgradeDesc');
    const clickUpgradeLevel = document.getElementById('clickUpgradeLevel');

    // Автокликер
    const buyAutoclicker = document.getElementById('buyAutoclicker');
    const autoclickerOwned = document.getElementById('autoclickerOwned');
    const autoclickerIcon = document.getElementById('autoclickerIcon');
    const autoclickerCountDisplay = document.getElementById('autoclickerCount');
    const autoclickerTimer = document.getElementById('autoclickerTimer');

    // Стоимость улучшения силы клика
    function getClickUpgradeCost(level) {
        return 500 + (level * 750);
    }

    // Сила клика
    function getClickPower(level) {
        return 1 + level;
    }

    // Стоимость автокликера зависит от ОБЩЕГО числа покупок
    function getAutoclickerCost(purchases) {
        return 4750 + (purchases * 5000);
    }

    // Обновление интерфейса
    function updateUI() {
        const clickPower = getClickPower(upgradeLevel);
        const clickUpgradeCost = getClickUpgradeCost(upgradeLevel);
        const autoclickerCost = getAutoclickerCost(autoclickerPurchases);

        // Главный экран
        counter.textContent = count;
        clickValueDisplay.textContent = `+${clickPower} за клик`;

        // Иконка автокликера
        if (autoclickerCount > 0 || autoclickerActive) {
            autoclickerIcon.classList.add('visible');
            autoclickerCountDisplay.textContent = autoclickerCount;
            autoclickerIcon.disabled = autoclickerActive;
        } else {
            autoclickerIcon.classList.remove('visible');
        }

        // Магазин
        shopBalance.textContent = count;

        // Улучшение силы клика
        clickUpgradeLevel.textContent = `Уровень: ${upgradeLevel}`;
        clickUpgradeDesc.textContent = `+${clickPower + 1} за каждое нажатие`;
        buyClickUpgrade.textContent = `Купить (${clickUpgradeCost})`;
        buyClickUpgrade.disabled = count < clickUpgradeCost;

        // Автокликер
        autoclickerOwned.textContent = `Доступно: ${autoclickerCount} | Куплено: ${autoclickerPurchases}`;
        buyAutoclicker.textContent = `Купить (${autoclickerCost})`;
        buyAutoclicker.disabled = count < autoclickerCost;
    }

    // Клик по яйцу
    egg.addEventListener('click', function () {
        count += getClickPower(upgradeLevel);
        updateUI();

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred('light');
        }
    });

    // Активация автокликера
    autoclickerIcon.addEventListener('click', function () {
        if (autoclickerCount > 0 && !autoclickerActive) {
            startAutoclicker();
        }
    });

    // Запуск автокликера
    function startAutoclicker() {
        autoclickerActive = true;
        autoclickerTimeLeft = 25;
        autoclickerCount--; // тратим заряд, но autoclickerPurchases НЕ трогаем

        egg.classList.add('auto-clicking');
        autoclickerIcon.disabled = true;
        autoclickerTimer.textContent = `${autoclickerTimeLeft}с`;

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('success');
        }

        // 20 кликов в секунду
        autoclickerInterval = setInterval(() => {
            count += getClickPower(upgradeLevel);
            updateUI();
        }, 50);

        // Таймер
        autoclickerTimerInterval = setInterval(() => {
            autoclickerTimeLeft--;
            autoclickerTimer.textContent = `${autoclickerTimeLeft}с`;

            if (autoclickerTimeLeft <= 0) {
                stopAutoclicker();
            }
        }, 1000);

        updateUI();
    }

    // Остановка автокликера
    function stopAutoclicker() {
        autoclickerActive = false;
        egg.classList.remove('auto-clicking');

        clearInterval(autoclickerInterval);
        clearInterval(autoclickerTimerInterval);

        autoclickerTimer.textContent = '';

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.notificationOccurred('warning');
        }

        updateUI();
    }

    // Открыть магазин
    shopBtn.addEventListener('click', function () {
        gameScreen.style.display = 'none';
        shopScreen.style.display = 'flex';
        updateUI();
    });

    // Вернуться назад
    backBtn.addEventListener('click', function () {
        shopScreen.style.display = 'none';
        gameScreen.style.display = 'flex';
        updateUI();
    });

    // Купить улучшение силы клика
    buyClickUpgrade.addEventListener('click', function () {
        const cost = getClickUpgradeCost(upgradeLevel);

        if (count >= cost) {
            count -= cost;
            upgradeLevel++;
            updateUI();

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
    });

    // Купить автокликер
    buyAutoclicker.addEventListener('click', function () {
        const cost = getAutoclickerCost(autoclickerPurchases);

        if (count >= cost) {
            count -= cost;
            autoclickerCount++;
            autoclickerPurchases++; // цена следующего увеличится на 5000
            updateUI();

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
        }
    });

    // Инициализация
    updateUI();
</script>
